<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>DRA Solutions | Tecnologia e Comunicação</title>
  <meta name="description" content="Soluções em tecnologia, comunicação, automação e atendimento para empresas." />
  <meta name="theme-color" content="#002B5C" />
  <meta name="color-scheme" content="light" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="DRA Solutions" />
  <meta property="og:title" content="DRA Solutions | Tecnologia e Comunicação" />
  <meta property="og:description" content="Soluções em tecnologia, comunicação, automação e atendimento para empresas." />
  <meta property="og:image" content="assets/images/dra-logo.svg" />
  <meta name="twitter:card" content="summary" />

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg" />

  <!-- Tipografia -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>

  <!-- ============================================================
       BACKGROUND — foto institucional. Puramente visual: aria-hidden
       e sem interação. Para trocar a foto, substitua o arquivo
       assets/images/hero-background.jpg (mesmo nome) ou ajuste o "src".
       ============================================================ -->
  <div class="bg-decoration" aria-hidden="true">
    <img class="bg-decoration__image" src="assets/images/hero-background.jpg" alt="" />
  </div>

  <div class="page">
    <main class="card">

      <!-- ============================================================
           CABEÇALHO / PERFIL
           ============================================================ -->
      <header class="profile">
        <div class="profile__logo-wrap reveal" style="animation-delay: 0ms;">
          <!--
            LOGO OFICIAL: substitua o arquivo assets/images/dra-logo.svg pela
            logo real da DRA Solutions (mesmo nome, ou ajuste o "src" abaixo).
            Não distorcer: a imagem é exibida em proporção 1:1 (quadrada).
          -->
          <img
            class="profile__logo"
            src="assets/images/dra-logo.svg"
            alt="Logo da DRA Solutions"
            width="88"
            height="88"
          />
        </div>

        <h1 class="profile__name reveal" style="animation-delay: 80ms;">DRA Solutions</h1>

        <p class="profile__status reveal" style="animation-delay: 140ms;">
          <span class="profile__status-dot"></span>
          Online
        </p>

        <p class="profile__description reveal" style="animation-delay: 200ms;">
          Tecnologia, comunicação e soluções inteligentes para empresas.
        </p>
      </header>

      <!-- ============================================================
           AÇÕES DE CONTATO
           Os links reais são definidos em assets/js/config.js
           ============================================================ -->
      <nav aria-label="Canais de contato da DRA Solutions">
        <ul class="actions">

          <li class="reveal" style="animation-delay: 280ms;">
            <a class="action action--primary" data-link="whatsapp" href="#" aria-label="Conversar no WhatsApp com a DRA Solutions (abre em nova aba)">
              <span class="action__icon">
                <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                  <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347zm-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884zm8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413z" />
                </svg>
              </span>
              <span class="action__label">WhatsApp</span>
              <span class="action__arrow">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M5 12h14" /><path d="m13 6 6 6-6 6" />
                </svg>
              </span>
            </a>
          </li>

          <li class="reveal" style="animation-delay: 340ms;">
            <a class="action" data-link="website" href="#" aria-label="Visitar o site da DRA Solutions (abre em nova aba)">
              <span class="action__icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <circle cx="12" cy="12" r="10" />
                  <path d="M2 12h20" />
                  <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10Z" />
                </svg>
              </span>
              <span class="action__label">Site</span>
              <span class="action__arrow">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M5 12h14" /><path d="m13 6 6 6-6 6" />
                </svg>
              </span>
            </a>
          </li>

          <li class="reveal" style="animation-delay: 400ms;">
            <a class="action" data-link="instagram" href="#" aria-label="Ver Instagram da DRA Solutions (abre em nova aba)">
              <span class="action__icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <rect x="3" y="3" width="18" height="18" rx="5" />
                  <circle cx="12" cy="12" r="4" />
                  <circle cx="17.5" cy="6.5" r="0.9" fill="currentColor" stroke="none" />
                </svg>
              </span>
              <span class="action__label">Instagram</span>
              <span class="action__arrow">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M5 12h14" /><path d="m13 6 6 6-6 6" />
                </svg>
              </span>
            </a>
          </li>

        </ul>
      </nav>

      <!-- ============================================================
           RODAPÉ
           ============================================================ -->
      <footer class="footer reveal" style="animation-delay: 460ms;">
        <p class="footer__brand">&copy; <span data-year>2026</span> DRA Solutions</p>
        <p class="footer__tagline">Tecnologia que conecta empresas.</p>
      </footer>

    </main>
  </div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
